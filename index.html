<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>에이텍컴퓨터 역량평가</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f6fa;--card:#fff;--ink:#1b2333;--ink2:#4a5468;--muted:#8a93a6;--line:#e3e7ef;
  --pri:#1f5fd6;--pri-d:#174bb0;--pri-l:#eaf1ff;
  --green:#14894f;--green-l:#e6f6ed;--amber:#b86e00;--amber-l:#fff4e0;--red:#c62f2f;--red-l:#fdecec;--gray-l:#eef0f4;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic','맑은 고딕',system-ui,sans-serif;font-size:16px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
a{color:var(--pri)}
.hidden{display:none!important}
/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#c5cddc;background:#f8fafd}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-d)}
.btn.danger{color:var(--red);border-color:#f0c6c6}
.btn.sm{padding:4px 10px;font-size:15px}
.btn.ghost{border-color:transparent;background:transparent}
/* 로그인 */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:36px 32px;width:100%;max-width:380px;box-shadow:0 8px 30px rgba(20,40,90,.06)}
.brand{font-weight:700;color:var(--pri);letter-spacing:.08em;font-size:15px}
.login-card h1{margin:6px 0 4px;font-size:26px}
.login-card .sub{margin:0 0 22px;color:var(--ink2)}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:14px;color:var(--ink2);margin-bottom:4px;font-weight:500}
.field input,.field select,.inp{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff}
.field input:focus,.inp:focus,select:focus{outline:2px solid var(--pri-l);border-color:var(--pri)}
.login-card .btn.pri{width:100%;padding:10px}
.hint{color:var(--muted);font-size:14px;margin:14px 0 0}
.err{color:var(--red);font-size:15px;min-height:18px;margin:4px 0 8px}
.demo-box{margin-top:18px;padding:12px;border:1px dashed #c9d6f2;border-radius:8px;background:#f7faff;font-size:14px;color:var(--ink2)}
.demo-box select{margin-top:6px}
/* 상단 */
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-in{max-width:1240px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:18px;height:56px}
.top .logo{font-weight:700;white-space:nowrap}
.top .logo b{color:var(--pri)}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
.tab{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--ink2);white-space:nowrap;font-weight:500}
.tab:hover{background:var(--gray-l)}
.tab.on{background:var(--pri-l);color:var(--pri)}
.who{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:15px;color:var(--ink2)}
.banner{background:var(--amber-l);color:var(--amber);text-align:center;padding:7px 16px;font-size:15px;font-weight:500}
.banner.demo{background:#eef4ff;color:var(--pri)}
main{max-width:1240px;margin:0 auto;padding:22px 16px 120px}
main.wide{max-width:1600px}
.top-in.wide{max-width:1600px}
/* 관리자 표: 줄바꿈 허용 + 마지막 열 고정 */
.tbl-fit td.wrap{white-space:normal;line-height:1.35}
.tbl-fit td.wrap small{display:block;color:var(--muted);font-size:13px}
.tbl-fit td select{width:100%;min-width:0;max-width:none}
.tbl-fit .c-form{width:22%}.tbl-fit .c-ev{width:13%}
.tbl-fit th:last-child,.tbl-fit td:last-child{position:sticky;right:0;background:#fff;box-shadow:-6px 0 8px -6px rgba(20,40,90,.15)}
.tbl-fit th:last-child{background:#f8f9fc}
.tbl-fit tr.dirty td:last-child{background:#fffbea}
.tbl-fit tr.off td:last-child{background:#fbfbfc}
.tbl-fit .hist{flex-wrap:nowrap;gap:4px}
.tbl-fit .hg{gap:2px}
h2{font-size:22px;margin:0 0 4px}
.desc{color:var(--ink2);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:17px}
/* 요약 숫자 */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .l{font-size:14px;color:var(--ink2)}
.kpi .v{font-size:26px;font-weight:700;margin-top:2px}
.kpi .v small{font-size:15px;color:var(--muted);font-weight:500}
.bar{height:6px;background:var(--gray-l);border-radius:4px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri)}
/* 표 */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{background:#f8f9fc;color:var(--ink2);font-weight:500;font-size:14px;position:sticky;top:0}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafbfe}
td.num,th.num{text-align:right}
td.c,th.c{text-align:center}
tr.off td{color:var(--muted);background:#fbfbfc}
tr.dirty td{background:#fffbea}
td select,td input.inp{padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:#fff;max-width:220px}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:14px;font-weight:500}
.b-gray{background:var(--gray-l);color:var(--ink2)}
.b-gray2{background:#f3f4f7;color:var(--muted)}
.b-amber{background:var(--amber-l);color:var(--amber)}
.b-green{background:var(--green-l);color:var(--green)}
.b-blue{background:var(--pri-l);color:var(--pri)}
.final{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid #cfe0ff;border-radius:var(--r);padding:14px 16px;margin-top:10px}
.final .t{flex:1;min-width:200px;color:var(--ink2);font-size:15px}
.b-red{background:var(--red-l);color:var(--red)}
.b-muted{background:transparent;color:var(--muted);padding-left:0}
.hist{display:inline-flex;gap:6px;flex-wrap:wrap}
.hg{display:inline-flex;align-items:center;gap:3px;font-size:14px;color:var(--ink2)}
.hg b{display:inline-block;min-width:20px;text-align:center;padding:1px 5px;border-radius:5px;font-size:14px}
.g-S{background:#efe7ff;color:#6a3fc9}.g-A{background:var(--green-l);color:var(--green)}.g-B{background:var(--gray-l);color:var(--ink2)}.g-C{background:var(--amber-l);color:var(--amber)}.g-D{background:var(--red-l);color:var(--red)}.g-none{background:transparent;color:#b8bfcc}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .inp,.toolbar select{width:auto;min-width:150px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff}
.toolbar .sp{flex:1}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* 내 평가 목록 */
.list{display:grid;gap:10px}
.trow{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.trow .nm{font-weight:700;font-size:17px;min-width:76px}
.trow .meta{color:var(--ink2);font-size:15px;flex:1;min-width:0}
.trow .meta div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .st{min-width:84px;text-align:center}
.trow .sc{min-width:92px;text-align:right;font-size:15px;color:var(--ink2)}
.trow .sc b{font-size:19px;color:var(--ink)}
.trow .sc small{color:var(--muted)}
.p1{font-size:14px;color:var(--ink2);background:#f1f4f9;border-radius:6px;padding:2px 8px;white-space:nowrap}
.p1 b{color:var(--ink)}
.sec-h .btn{margin-left:auto}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.sec-h h3{margin:0;font-size:18px}
.sec-h span{color:var(--ink2);font-size:15px}
/* 평가 입력 */
.ev-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ev-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 18px;font-size:15px}
.ev-info .l{color:var(--muted);font-size:14px}
.ev-info .v{font-weight:500}
.note{padding:10px 14px;border-radius:8px;font-size:15px;margin-bottom:14px}
.note.info{background:var(--pri-l);color:#1d4ba8}
.note.ok{background:var(--green-l);color:var(--green)}
.note.warn{background:var(--amber-l);color:var(--amber)}
.grp-h{font-size:16px;font-weight:700;color:var(--pri);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.grp-h::after{content:"";flex:1;height:1px;background:var(--line)}
.item{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.item.done{border-color:#cfe0ff}
.item-h{display:flex;align-items:center;gap:10px}
.item-h .no{width:24px;height:24px;border-radius:50%;background:var(--gray-l);display:inline-flex;align-items:center;justify-content:center;font-size:14px;color:var(--ink2);flex:none}
.item.done .no{background:var(--pri);color:#fff}
.item-h b{font-size:17px;flex:1}
.item-h .cur{font-size:21px;font-weight:700;color:var(--pri);min-width:48px;text-align:right}
.item-h .cur small{font-size:14px;color:var(--muted);font-weight:400}
.ind{margin:8px 0 12px 34px;padding:0;list-style:none;color:var(--ink2);font-size:15px}
.ind li{position:relative;padding-left:12px;margin-bottom:2px}
.ind li::before{content:"";position:absolute;left:0;top:9px;width:4px;height:4px;border-radius:50%;background:#aab3c5}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;margin-left:34px}
.scale button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 0;cursor:pointer;font-weight:500;font-size:15px}
.scale button:hover:not(:disabled):not(.on){border-color:var(--pri);color:var(--pri)}
.scale button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.scale button:disabled{cursor:default}
.scale button:disabled:not(.on){opacity:.5}
.scale-lg{display:flex;justify-content:space-between;margin:4px 0 0 34px;font-size:13px;color:var(--muted)}
.guide{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-bottom:14px;font-size:15px}
.guide summary{cursor:pointer;font-weight:700;color:var(--pri)}
.guide table{margin-top:8px;font-size:15px}
.guide td{white-space:normal;padding:6px 10px}
.guide td:first-child{font-weight:700;white-space:nowrap;width:110px}
.footbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:30;box-shadow:0 -4px 16px rgba(20,40,90,.05)}
.footbar-in{max-width:1240px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.footbar .sum{flex:1;font-size:15px;color:var(--ink2)}
.footbar .sum b{font-size:19px;color:var(--ink)}
.automsg{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.tgt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px;font-size:15px;color:var(--ink2)}
.tgt b{color:var(--ink)}
.tgt .d{font-weight:700;padding:1px 8px;border-radius:6px;font-size:14px}
.tgt .d.ok{background:var(--green-l);color:var(--green)}.tgt .d.hi{background:var(--amber-l);color:var(--amber)}.tgt .d.lo{background:#eef3ff;color:var(--pri)}
.gauge{position:relative;width:180px;height:8px;background:var(--gray-l);border-radius:4px;flex:none}
.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--pri)}
.gauge em{position:absolute;top:-4px;width:2px;height:16px;background:var(--ink);border-radius:1px}
.sec-tgt{font-size:15px;color:var(--ink2)}
.totop{position:fixed;right:20px;bottom:24px;z-index:40;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--pri);font-size:22px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(20,40,90,.16);opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s}
.totop.show{opacity:1;pointer-events:auto;transform:none}
.totop:hover{background:var(--pri);color:#fff;border-color:var(--pri)}
.autonext{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.autonext input{width:16px;height:16px}
.item.next{box-shadow:0 0 0 2px var(--pri-l)}
.automsg.err{color:var(--red)}
.automsg.ok{color:var(--green)}
/* 모달 */
.mask{position:fixed;inset:0;background:rgba(15,25,45,.42);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:#fff;border-radius:12px;width:100%;max-width:460px;max-height:90vh;overflow:auto;padding:22px}
.modal.wide{max-width:760px}
.modal h3{margin:0 0 10px;font-size:19px}
.modal p{margin:0 0 14px;color:var(--ink2);white-space:pre-line}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.tst{background:#1b2333;color:#fff;padding:10px 16px;border-radius:8px;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.tst.err{background:var(--red)}
.loading{padding:60px;text-align:center;color:var(--muted)}
.chk{display:flex;align-items:center;gap:8px;margin:6px 0}
.upl-sum{margin:12px 0;font-size:15px}
.upl-sum li{margin:2px 0}
.warn-list{max-height:180px;overflow:auto;background:var(--amber-l);color:#7a4a00;border-radius:8px;padding:10px 14px 10px 28px;font-size:14px;margin:8px 0}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.switch input{width:18px;height:18px}
.form-items{margin:4px 0 4px;background:#fafbfd}
.form-items td{white-space:normal;vertical-align:top}
@media (max-width:720px){
  .top-in{flex-wrap:wrap;height:auto;padding:10px 16px;gap:8px}
  .tabs{order:3;flex-basis:100%}
  .who .nmtxt{display:none}
  .trow{flex-wrap:wrap;gap:8px}
  .trow .meta{flex-basis:100%;order:3}
  .trow .st{min-width:0;margin-left:auto}
  .trow .sc{min-width:0}
  .scale{grid-template-columns:repeat(6,1fr);margin-left:0}
  .scale-lg,.ind{margin-left:0}
  .grid2{grid-template-columns:1fr}
  .footbar-in{flex-wrap:wrap;gap:8px;padding:10px 16px}
  .footbar .sum{flex-basis:100%}
  .gauge{width:110px}
  .tgt .gauge,.tgt .tn{display:none}
  .footbar .sum{font-size:14px}
  .autonext{flex-basis:100%;font-size:13px}
  .totop{right:14px;width:44px;height:44px}
  .footbar .btn{flex:1}
  main{padding-bottom:170px}
}
</style>
</head>
<body>
<div id="app"><div class="loading">불러오는 중…</div></div>
<div id="modal"></div>
<div id="toast"></div>
<button id="toTop" class="totop" type="button" title="맨 위로" aria-label="맨 위로">↑</button>
<script>
/* =============================================================
   설정: Supabase 프로젝트 정보를 넣으면 실제 운영 모드로 동작합니다.
   (비워두면 데모 모드 — 저장 내용은 새로고침하면 사라집니다)
   Supabase > Project Settings > API 에서 확인
   ============================================================= */
const CONFIG = {
  SUPABASE_URL: 'https://esccbbkmbjpkhqdrirpx.supabase.co',
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzY2NiYmttYmpwa2hxZHJpcnB4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5Mzk5MzIsImV4cCI6MjEwOTUxNTkzMn0.M_XVSXv8B2OfOnycIkUfyDM4lITsw0UJMk22CdHUnhI'
};

const DEMO = !CONFIG.SUPABASE_URL;
const SEED = /*SEED*/null;

/* ---------- 공통 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const nowISO = () => new Date().toISOString();
const padEmp = v => { if (v == null) return ''; let s = String(v).trim(); if (/^\d+$/.test(s) && s.length < 5) s = s.padStart(5, '0'); return s; };
const fmtDT = s => s ? new Date(s).toLocaleString('ko-KR', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'}) : '';
const GRP_ORDER = ['공통', '직무', '리더십'];
const STATUS = {
  none: ['미작성', 'gray'], draft: ['작성중', 'amber'], submitted: ['제출완료', 'green'],
  filled: ['입력완료', 'blue'], wait: ['1차 대기', 'gray2'], end: ['1차 종결', 'muted'], noform: ['평가표 미지정', 'red'], noev: ['평가자 미지정', 'red']
};
const badge = k => `<span class="badge b-${STATUS[k][1]}">${STATUS[k][0]}</span>`;
const GRADES = ['S', 'A', 'B', 'C', 'D'];
const histYears = () => [ST.settings.cycle - 3, ST.settings.cycle - 2, ST.settings.cycle - 1];
// 최근 3년 등급 표시 (map: 'emp-year' -> grade)
function histHtml(map, emp) {
  return `<span class="hist">${histYears().map(y => { const g = map.get(emp + '-' + y); return `<span class="hg">${String(y).slice(2)}년 <b class="g-${g || 'none'}">${g || '-'}</b></span>`; }).join('')}</span>`;
}
const histMap = rows => new Map((rows || []).map(h => [h.emp_no + '-' + h.year, h.grade]));

function toast(msg, isErr) {
  const d = document.createElement('div');
  d.className = 'tst' + (isErr ? ' err' : '');
  d.textContent = msg;
  $('#toast').appendChild(d);
  setTimeout(() => d.remove(), isErr ? 4200 : 2400);
}
function modal(html, wide) {
  $('#modal').innerHTML = `<div class="mask"><div class="modal ${wide ? 'wide' : ''}">${html}</div></div>`;
  return $('#modal .modal');
}
function closeModal() { $('#modal').innerHTML = ''; }
function confirmBox(title, msg, okText = '확인', danger = false) {
  return new Promise(res => {
    const m = modal(`<h3>${esc(title)}</h3><p>${esc(msg)}</p>
      <div class="acts"><button class="btn" data-x="n">취소</button><button class="btn ${danger ? 'danger' : 'pri'}" data-x="y">${esc(okText)}</button></div>`);
    m.addEventListener('click', e => { const x = e.target.dataset.x; if (x) { closeModal(); res(x === 'y'); } });
  });
}
function errMsg(e) {
  const m = (e && (e.message || e.error_description)) || String(e);
  if (/Invalid login credentials/i.test(m)) return '이메일 또는 비밀번호가 올바르지 않습니다';
  if (/Password should be at least/i.test(m)) return '비밀번호가 너무 짧습니다';
  if (/same.*password|different from the old/i.test(m)) return '기존 비밀번호와 다른 비밀번호를 입력하세요';
  if (/Failed to fetch|NetworkError/i.test(m)) return '서버에 연결할 수 없습니다. 인터넷 연결을 확인하세요';
  return m;
}
// 100점 환산 (배점 비율 반영, 배점이 비어 있으면 동일 비중) — 모든 역량 입력 시에만
function score100(items, scores) {
  if (!items || !items.length || items.some(i => scores[i.seq] == null)) return null;
  const noW = items.some(i => i.weight_ref == null || i.weight_ref === '') || items.reduce((a, i) => a + (+i.weight_ref || 0), 0) === 0;
  if (noW) return Math.round(items.reduce((a, i) => a + scores[i.seq], 0) / items.length * 10 * 10) / 10;
  const ws = items.reduce((a, i) => a + +i.weight_ref, 0);
  return Math.round(items.reduce((a, i) => a + scores[i.seq] * +i.weight_ref, 0) / ws * 10 * 10) / 10;
}
function cleanScores(items, scores, submit) {
  const out = {};
  for (const [k, v] of Object.entries(scores || {})) {
    if (v === null || v === undefined || v === '') continue;
    if (!items.some(i => String(i.seq) === String(k))) throw new Error('잘못된 문항입니다');
    if (!Number.isInteger(v) || v < 0 || v > 10) throw new Error('점수는 0~10 정수만 입력할 수 있습니다');
    out[k] = v;
  }
  if (submit && Object.keys(out).length !== items.length) throw new Error('모든 역량에 점수를 입력해야 제출할 수 있습니다');
  return out;
}
// 대상자 일괄 반영 계획: 이미 평가가 있는 사람의 평가표·평가자 변경은 건너뜀
function planTargets(existing, evTargetIds, list, overwrite) {
  const byEmp = new Map(existing.map(t => [t.emp_no, t]));
  const ins = [], upd = [], skip = [];
  for (let r of list) {
    const t = byEmp.get(r.emp_no);
    if (!t) { ins.push(r); continue; }
    if (!overwrite) r = { ...r, form_code: t.form_code, e1_emp: t.e1_emp, e2_emp: t.e2_emp };
    const changed = (r.form_code || null) !== (t.form_code || null) || (r.e1_emp || null) !== (t.e1_emp || null) || (r.e2_emp || null) !== (t.e2_emp || null);
    if (changed && evTargetIds.has(t.id)) { skip.push(r.name); continue; }
    upd.push({ ...r, id: t.id });
  }
  return { ins, upd, skip };
}

/* =============================================================
   데이터 처리 - 운영(Supabase)
   ============================================================= */
function makeSupabaseApi() {
  const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const chk = r => { if (r.error) throw r.error; return r.data; };
  return {
    demo: false,
    async signIn(email, pw) { chk(await sb.auth.signInWithPassword({ email: email.trim(), password: pw })); },
    async signOut() { await sb.auth.signOut(); },
    async hasSession() { const { data } = await sb.auth.getSession(); return !!data.session; },
    async me() { const d = chk(await sb.rpc('my_account')); return (d && d[0]) || null; },
    async changePassword(pw) { chk(await sb.auth.updateUser({ password: pw })); chk(await sb.rpc('mark_pw_changed')); },
    async settings() { return chk(await sb.from('settings').select('*').eq('id', 1).single()); },
    async myTargets() { return chk(await sb.rpc('my_targets')) || []; },
    async formItems(code) { return chk(await sb.from('form_items').select('*').eq('form_code', code).order('seq')); },
    async stage1For(tids) { if (!tids.length) return []; return chk(await sb.from('evaluations').select('target_id,scores,status,submitted_at').in('target_id', tids).eq('stage', 1).eq('status', 'submitted')) || []; },
    async myEvaluations(emp) { return chk(await sb.from('evaluations').select('target_id,stage,scores,status').eq('evaluator_emp', emp)) || []; },
    async itemsFor(codes) { if (!codes.length) return []; return chk(await sb.from('form_items').select('form_code,seq,weight_ref').in('form_code', codes).range(0, 9999)) || []; },
    async myHistory() { return chk(await sb.from('history').select('*').range(0, 9999)) || []; },
    async myEvaluation(tid, stage, emp) {
      return chk(await sb.from('evaluations').select('*').eq('target_id', tid).eq('stage', stage).eq('evaluator_emp', emp).maybeSingle());
    },
    async submitAll(stage) { return chk(await sb.rpc('submit_all', { p_stage: stage })); },
    async saveEvaluation(tid, stage, scores, submit) {
      chk(await sb.rpc('save_evaluation', { p_target: tid, p_stage: stage, p_scores: scores, p_submit: submit }));
    },
    adm: {
      async loadAll() {
        const s = chk(await sb.from('settings').select('*').eq('id', 1).single());
        const [targets, evaluations, accounts, forms, items, history] = await Promise.all([
          sb.from('targets').select('*').eq('cycle', s.cycle).order('id'),
          sb.from('evaluations').select('*'),
          sb.from('accounts').select('*').order('emp_no'),
          sb.from('forms').select('*').order('code'),
          sb.from('form_items').select('*').order('form_code').order('seq').range(0, 9999),
          sb.from('history').select('*').range(0, 9999)
        ].map(p => p.then(chk)));
        const tids = new Set(targets.map(t => t.id));
        return { settings: s, targets, evaluations: evaluations.filter(e => tids.has(e.target_id)), accounts, forms, items, history };
      },
      async updateTarget(id, p, force) {
        chk(await sb.rpc('admin_update_target', { p_id: id, p_form: p.form_code || null, p_e1: p.e1_emp || null, p_e2: p.e2_emp || null, p_included: p.included, p_note: p.note || null, p_force: !!force }));
      },
      async addTarget(t) { chk(await sb.from('targets').insert(t)); },
      async reopen(tid, stage) { chk(await sb.rpc('admin_reopen', { p_target: tid, p_stage: stage })); },
      async saveSettings(s) { chk(await sb.from('settings').update({ cycle: s.cycle, is_open: s.is_open, adj_target: s.adj_target }).eq('id', 1)); },
      async saveAccount(a, oldEmp) {
        if (oldEmp && oldEmp !== a.emp_no) chk(await sb.from('accounts').update({ emp_no: a.emp_no, name: a.name, email: a.email, role: a.role }).eq('emp_no', oldEmp));
        else chk(await sb.from('accounts').upsert({ emp_no: a.emp_no, name: a.name, email: a.email, role: a.role }, { onConflict: 'emp_no' }));
      },
      async upsertHistory(list) { if (list.length) chk(await sb.from('history').upsert(list, { onConflict: 'emp_no,year' })); },
      async upsertAccounts(list) {
        // 회사메일이 빈 행은 기존 이메일을 지우지 않도록 이메일 없이 반영
        const withMail = list.filter(a => a.email), noMail = list.filter(a => !a.email).map(({ email, ...r }) => r);
        if (withMail.length) chk(await sb.from('accounts').upsert(withMail, { onConflict: 'emp_no' }));
        if (noMail.length) chk(await sb.from('accounts').upsert(noMail, { onConflict: 'emp_no' }));
      },
      async upsertForms(forms, items) {
        if (!forms.length) return;
        chk(await sb.from('forms').upsert(forms, { onConflict: 'code' }));
        const codes = forms.map(f => f.code);
        chk(await sb.from('form_items').delete().in('form_code', codes));
        if (items.length) chk(await sb.from('form_items').insert(items));
      },
      async upsertTargets(cycle, list, overwrite) {
        const existing = chk(await sb.from('targets').select('*').eq('cycle', cycle));
        const ev = chk(await sb.from('evaluations').select('target_id'));
        const plan = planTargets(existing, new Set(ev.map(e => e.target_id)), list, overwrite);
        if (plan.ins.length) chk(await sb.from('targets').insert(plan.ins.map(r => ({ ...r, cycle }))));
        if (plan.upd.length) chk(await sb.from('targets').upsert(plan.upd.map(r => ({ ...r, cycle })), { onConflict: 'id' }));
        return { inserted: plan.ins.length, updated: plan.upd.length, skipped: plan.skip };
      }
    }
  };
}

/* =============================================================
   데이터 처리 - 데모 (브라우저 메모리)
   ============================================================= */
function makeDemoApi() {
  const S = { settings: { id: 1, cycle: 2026, is_open: true, adj_target: 80 }, accounts: [], forms: [], items: [], targets: [], evaluations: [], history: [] };
  (SEED.history || []).forEach(([emp_no, year, grade]) => S.history.push({ emp_no, year, grade }));
  let cur = null, nextId = 1;
  SEED.forms.forEach(([code, name, kind]) => S.forms.push({ code, name, kind }));
  SEED.items.forEach(([form_code, seq, grp, name, weight_ref, ind1, ind2]) => S.items.push({ form_code, seq, grp, name, weight_ref, ind1, ind2 }));
  SEED.accounts.forEach(([emp_no, name, email, role]) => S.accounts.push({ emp_no, name, email, role, pw_changed: true }));
  SEED.targets.forEach(([emp_no, name, dept, team, grade, pos, form_code, e1, e2, inc]) =>
    S.targets.push({ id: nextId++, cycle: 2026, emp_no, name, dept, team, grade, pos, form_code: form_code || null, e1_emp: e1 || null, e2_emp: e2 || null, included: inc, note: '' }));
  const itemsOf = c => S.items.filter(i => i.form_code === c).sort((a, b) => a.seq - b.seq);
  // 시연용 진행 데이터: 공공영업팀 1차 일부 제출
  S.targets.filter(t => t.e1_emp === '09929' && t.included).forEach((t, i) => {
    const sc = {}; itemsOf(t.form_code).forEach((it, j) => sc[it.seq] = Math.min(10, 4 + ((i * 7 + j * 3) % 6) + (j < 5 ? i % 3 : 0)));
    S.evaluations.push({ target_id: t.id, stage: 1, evaluator_emp: '09929', scores: sc, status: i < 4 ? 'submitted' : 'draft', updated_at: nowISO(), submitted_at: i < 4 ? nowISO() : null });
  });
  const acc = () => S.accounts.find(a => a.email && a.email.toLowerCase() === cur);
  const meEmp = () => (acc() || {}).emp_no || null;
  const isAdmin = () => (acc() || {}).role === 'admin';
  const need = () => { if (!isAdmin()) throw new Error('관리자만 가능합니다'); };
  const ev = (tid, st) => S.evaluations.find(e => e.target_id === tid && e.stage === st);
  const delay = () => new Promise(r => setTimeout(r, 120));
  return {
    demo: true,
    async signIn(email) {
      await delay();
      const a = S.accounts.find(a => a.email && a.email.toLowerCase() === String(email).trim().toLowerCase());
      if (!a) throw new Error('등록되지 않은 이메일입니다');
      cur = a.email.toLowerCase();
    },
    async signOut() { cur = null; },
    async hasSession() { return !!cur; },
    async me() { return clone(acc() || null); },
    async changePassword() { await delay(); acc().pw_changed = true; },
    async settings() { return clone(S.settings); },
    async myTargets() {
      await delay();
      const me = meEmp(), out = [];
      const fn = c => (S.forms.find(f => f.code === c) || {}).name || null;
      const row = (t, stage, e, s1) => ({ target_id: t.id, stage, emp_no: t.emp_no, name: t.name, dept: t.dept, team: t.team, grade: t.grade, pos: t.pos, form_code: t.form_code, form_name: fn(t.form_code), status: e ? e.status : 'none', stage1_done: s1, updated_at: e ? e.updated_at : null });
      S.targets.filter(t => t.cycle === S.settings.cycle && t.included).forEach(t => {
        if (t.e1_emp === me) out.push(row(t, 1, ev(t.id, 1), true));
        if (t.e2_emp === me) { const e1 = ev(t.id, 1); out.push(row(t, 2, ev(t.id, 2), !!e1 && e1.status === 'submitted')); }
      });
      return out;
    },
    async formItems(code) { return clone(itemsOf(code)); },
    async stage1For(tids) {
      const me = meEmp();
      return clone(S.evaluations.filter(e => tids.includes(e.target_id) && e.stage === 1 && e.status === 'submitted' && (S.targets.find(t => t.id === e.target_id) || {}).e2_emp === me));
    },
    async myEvaluations() { const me = meEmp(); return clone(S.evaluations.filter(e => e.evaluator_emp === me)); },
    async itemsFor(codes) { return clone(S.items.filter(i => codes.includes(i.form_code)).map(i => ({ form_code: i.form_code, seq: i.seq, weight_ref: i.weight_ref }))); },
    async myHistory() {
      const me = meEmp();
      const emps = new Set(S.targets.filter(t => t.cycle === S.settings.cycle && t.included && (t.e1_emp === me || t.e2_emp === me)).map(t => t.emp_no));
      return clone(S.history.filter(h => emps.has(h.emp_no)));
    },
    async myEvaluation(tid, stage) { const e = ev(tid, stage); return e && e.evaluator_emp === meEmp() ? clone(e) : null; },
    async submitAll(stage) {
      await delay();
      const me = meEmp();
      if (!S.settings.is_open) throw new Error('평가 기간이 아닙니다');
      const cand = S.targets.filter(t => t.cycle === S.settings.cycle && t.included && t.form_code && (stage === 1 ? t.e1_emp : t.e2_emp) === me
        && (stage === 1 || ((ev(t.id, 1) || {}).status === 'submitted')) && (ev(t.id, stage) || {}).status !== 'submitted');
      const miss = cand.filter(t => { const e = ev(t.id, stage); return !e || Object.keys(e.scores).length !== itemsOf(t.form_code).length; }).map(t => t.name).sort();
      if (miss.length) throw new Error('점수를 모두 입력하지 않은 대상자가 있습니다: ' + miss.join(', '));
      if (!cand.length) throw new Error('최종 제출할 대상자가 없습니다');
      cand.forEach(t => { const e = ev(t.id, stage); e.status = 'submitted'; e.submitted_at = nowISO(); });
      return cand.length;
    },
    async saveEvaluation(tid, stage, scores, submit) {
      await delay();
      const me = meEmp();
      if (!S.settings.is_open) throw new Error('평가 기간이 아닙니다');
      const t = S.targets.find(x => x.id === tid && x.cycle === S.settings.cycle && x.included);
      if (!t) throw new Error('대상자를 찾을 수 없습니다');
      if ((stage === 1 ? t.e1_emp : t.e2_emp) !== me) throw new Error('평가 권한이 없습니다');
      if (stage === 2) { const e1 = ev(tid, 1); if (!e1 || e1.status !== 'submitted') throw new Error('1차 평가가 아직 제출되지 않았습니다'); }
      const e = ev(tid, stage);
      if (e && e.status === 'submitted') throw new Error('이미 제출된 평가입니다');
      const items = itemsOf(t.form_code);
      if (!items.length) throw new Error('평가표가 지정되지 않았습니다');
      const clean = cleanScores(items, scores, submit);
      const rec = { target_id: tid, stage, evaluator_emp: me, scores: clean, status: submit ? 'submitted' : 'draft', updated_at: nowISO(), submitted_at: submit ? nowISO() : null };
      if (e) Object.assign(e, rec); else S.evaluations.push(rec);
    },
    adm: {
      async loadAll() {
        need(); await delay();
        const targets = S.targets.filter(t => t.cycle === S.settings.cycle);
        const tids = new Set(targets.map(t => t.id));
        return clone({ settings: S.settings, targets, evaluations: S.evaluations.filter(e => tids.has(e.target_id)), accounts: S.accounts, forms: S.forms, items: S.items, history: S.history });
      },
      async updateTarget(id, p, force) {
        need(); await delay();
        const t = S.targets.find(x => x.id === id);
        const f = p.form_code || null, e1 = p.e1_emp || null, e2 = p.e2_emp || null;
        let aff = [];
        if (f !== t.form_code) aff = [1, 2]; else { if (e1 !== t.e1_emp) aff.push(1); if (e2 !== t.e2_emp) aff.push(2); }
        if (S.evaluations.some(e => e.target_id === id && aff.includes(e.stage))) {
          if (!force) throw new Error('HAS_EVAL');
          S.evaluations = S.evaluations.filter(e => !(e.target_id === id && aff.includes(e.stage)));
        }
        Object.assign(t, { form_code: f, e1_emp: e1, e2_emp: e2, included: p.included, note: p.note || '' });
      },
      async addTarget(t) {
        need(); await delay();
        if (S.targets.some(x => x.cycle === t.cycle && x.emp_no === t.emp_no)) throw new Error('이미 등록된 사번입니다');
        S.targets.push({ id: nextId++, ...t });
      },
      async reopen(tid, stage) { need(); const e = ev(tid, stage); if (e) { e.status = 'draft'; e.submitted_at = null; } },
      async saveSettings(s) { need(); S.settings.cycle = s.cycle; S.settings.is_open = s.is_open; S.settings.adj_target = s.adj_target; },
      async saveAccount(a, oldEmp) {
        need();
        if (a.email && S.accounts.some(x => x.email && x.email.toLowerCase() === a.email.toLowerCase() && x.emp_no !== (oldEmp || a.emp_no))) throw new Error('이미 사용 중인 이메일입니다');
        const x = S.accounts.find(x => x.emp_no === (oldEmp || a.emp_no));
        if (x) {
          if (oldEmp && oldEmp !== a.emp_no) S.targets.forEach(t => { if (t.e1_emp === oldEmp) t.e1_emp = a.emp_no; if (t.e2_emp === oldEmp) t.e2_emp = a.emp_no; });
          Object.assign(x, { emp_no: a.emp_no, name: a.name, email: a.email, role: a.role });
        } else S.accounts.push({ ...a, pw_changed: false });
      },
      async upsertHistory(list) {
        need();
        list.forEach(h => { const x = S.history.find(x => x.emp_no === h.emp_no && x.year === h.year); if (x) x.grade = h.grade; else S.history.push({ ...h }); });
      },
      async upsertAccounts(list) {
        need();
        list.forEach(a => {
          const x = S.accounts.find(x => x.emp_no === a.emp_no), r = { ...a };
          if (!r.email) delete r.email;
          if (x) Object.assign(x, r); else S.accounts.push({ email: null, ...r, pw_changed: false });
        });
      },
      async upsertForms(forms, items) {
        need();
        forms.forEach(f => { const x = S.forms.find(x => x.code === f.code); if (x) Object.assign(x, f); else S.forms.push({ ...f }); });
        const codes = new Set(forms.map(f => f.code));
        S.items = S.items.filter(i => !codes.has(i.form_code)).concat(items.map(i => ({ ...i })));
      },
      async upsertTargets(cycle, list, overwrite) {
        need();
        const existing = S.targets.filter(t => t.cycle === cycle);
        const plan = planTargets(existing, new Set(S.evaluations.map(e => e.target_id)), list, overwrite);
        plan.ins.forEach(r => S.targets.push({ id: nextId++, cycle, ...r }));
        plan.upd.forEach(r => Object.assign(S.targets.find(t => t.id === r.id), r));
        return { inserted: plan.ins.length, updated: plan.upd.length, skipped: plan.skip };
      }
    }
  };
}

async function go(view) {
  if (ST.ev && ST.ev.dirty) await doAutosave();
  if (ST.ev && ST.ev.dirty && !(await confirmBox('저장하지 않은 점수', '저장하지 않은 점수가 있습니다. 이동하면 입력한 내용이 사라집니다.', '이동', true))) return;
  ST.ev = null; ST.view = view; document.body.classList.remove('has-foot'); toTopBtn.style.bottom = '';
  $('#app').innerHTML = shell('<div class="loading">불러오는 중…</div>');
  try {
    if (view === 'my') {
      ST.my = await api.myTargets();
      const codes = [...new Set(ST.my.map(r => r.form_code).filter(Boolean))];
      const s2 = ST.my.filter(r => r.stage === 2 && r.stage1_done).map(r => r.target_id);
      const [evs, its, p1] = await Promise.all([api.myEvaluations(ST.me.emp_no), api.itemsFor(codes), api.stage1For(s2)]);
      ST.myP1 = new Map(p1.map(e => [e.target_id, e]));
      ST.myEv = new Map(evs.map(e => [e.target_id + '-' + e.stage, e]));
      ST.myItems = {}; its.forEach(i => (ST.myItems[i.form_code] = ST.myItems[i.form_code] || []).push(i));

    }
    else { ST.adm = await api.adm.loadAll(); ST.settings = ST.adm.settings; renderAdmin(); }
  } catch (e) { $('#app').innerHTML = shell(`<div class="card empty">불러오지 못했습니다: ${esc(errMsg(e))}</div>`); }
  window.scrollTo(0, 0);
}
function renderAdmin() {
  ({ progress: renderProgress, targets: renderTargets, forms: renderForms, accounts: renderAccounts, settings: renderSettings })[ST.view]();
}
document.addEventListener('click', async e => {
  const g = e.target.closest('[data-go]'); if (g) return go(g.dataset.go);
  const a = e.target.closest('[data-act]'); if (!a) return;

    if (ST.ev && ST.ev.dirty) await doAutosave();
    if (ST.ev && ST.ev.dirty && !(await confirmBox('저장하지 않은 점수', '저장하지 않은 점수가 있습니다. 로그아웃할까요?', '로그아웃', true))) return;

  }
  if (act === 'pw') return renderChangePw(false);
  if (HANDLERS[act]) HANDLERS[act](a, e);
});
window.addEventListener('beforeunload', e => { if (ST.ev && ST.ev.dirty) { e.preventDefault(); e.returnValue = ''; } });
const HANDLERS = {};

/* =============================================================
   평가자: 내 평가
   ============================================================= */
function myKey(r) {
  if (!r.form_code) return 'noform';
  if (r.stage === 2 && !r.stage1_done) return 'wait';
  if (r.status === 'draft') { const x = myScoreInfo(r); if (x && x.filled === x.n) return 'filled'; }
  return r.status;
}
function renderMy() {
  const sec = stage => {
    const rows = ST.my.filter(r => r.stage === stage).sort((a, b) => (a.dept || '').localeCompare(b.dept || '') || (a.team || '').localeCompare(b.team || '') || a.name.localeCompare(b.name));
    if (!rows.length) return '';
    const done = rows.filter(r => r.status === 'submitted').length;
    const sa = stageAvg(stage);
    return `<div class="sec-h"><h3>${stage}차 평가</h3><span>${rows.length}명 중 ${done}명 제출</span><span class="sec-tgt">· 내 평균 ${sa ? `<b>${sa.avg}</b>점` : '-'} / 목표 ${ADJ()}점</span>${rows.some(r => ST.myEv.get(r.target_id + '-' + stage)) ? `<button class="btn sm" data-act="myCompare" data-s="${stage}">점수 비교</button>` : ''}</div>
      <div class="list">${rows.map(r => {
        const k = myKey(r);
        const btn = k === 'submitted' ? `<button class="btn sm" data-act="open" data-t="${r.target_id}" data-s="${stage}">보기</button>`
          : (k === 'wait' || k === 'noform') ? `<button class="btn sm" disabled>${k === 'wait' ? '1차 제출 후 가능' : '평가 불가'}</button>`
          : `<button class="btn sm ${k === 'filled' ? '' : 'pri'}" data-act="open" data-t="${r.target_id}" data-s="${stage}">${k === 'filled' ? '수정' : k === 'draft' ? '이어서 작성' : '평가하기'}</button>`;
        return `<div class="trow">
          <div class="nm">${esc(r.name)}</div>
          <div class="meta"><div>${esc(r.dept || '')}${r.team && r.team !== r.dept ? ' · ' + esc(r.team) : ''} · ${esc(r.grade || '')}${r.pos ? ' / ' + esc(r.pos) : ''}</div>
            <div style="color:var(--muted)">${esc(r.form_name || '평가표 미지정')}</div></div>
          <div class="sc">${myScoreCell(r)}</div><div class="st">${badge(k)}</div>${btn}</div>`;
      }).join('')}</div>${finalBar(stage, rows)}`;
  };
  const total = ST.my.length, done = ST.my.filter(r => r.status === 'submitted').length, st = myStats();
  const body = ST.my.length ? `${adjNoteHtml()}
    <div class="kpis">
      <div class="kpi"><div class="l">평가할 인원(건)</div><div class="v">${total}</div></div>
      <div class="kpi"><div class="l">제출 완료</div><div class="v">${done} <small>/ ${total}</small></div><div class="bar"><i style="width:${total ? done / total * 100 : 0}%"></i></div></div>
      <div class="kpi"><div class="l">내가 준 점수 평균 (100점 환산)</div><div class="v">${st ? st.avg : '-'} <small>조정 기준 ${ADJ()}점</small></div>
        <div style="font-size:14px;color:var(--ink2)">${st ? `입력 완료 ${st.n}건 · 점수 차이(편차) ${st.sd}점` : '모든 역량을 입력하면 계산됩니다'}</div></div>
    </div>${statsHint(st)}${sec(1)}${sec(2)}`
    : `<div class="card empty">배정된 평가 대상자가 없습니다.</div>`;
  $('#app').innerHTML = shell(`<h2>내 평가</h2><p class="desc">역량별로 0~10점(정수)을 입력합니다. 점수는 자동 저장되며, 모두 입력한 뒤 차수별 <b>[최종 제출]</b>을 누르면 완료됩니다. 최종 제출 후에는 수정할 수 없습니다.</p>${body}`);
}

const ADJ = () => ST.settings.adj_target ?? 80;
function adjNoteHtml() {
  return `<div class="note info adj"><b>조정계수 안내</b> — 최종 점수는 부서(사업부·실)별 평균이 <b>${ADJ()}점</b>이 되도록 조정됩니다.
    실장·사업부장은 별도 그룹, 인원이 적은 그룹은 전사 평균 기준으로 조정합니다.<br>
    모두 높게 주면 조정 후 차이만 줄어들 뿐 유리해지지 않습니다. <b>잘한 사람과 보완이 필요한 사람의 차이가 드러나도록</b> 평가해 주세요.</div>`;
}
// 내가 준 점수(모든 역량 입력 완료분)의 100점 환산 평균·편차
function myStats(stage) {
  const v = ST.my.filter(r => !stage || r.stage === stage).map(r => myScoreInfo(r)).filter(x => x && x.s100 != null).map(x => x.s100);
  if (!v.length) return null;
  const avg = v.reduce((a, b) => a + b, 0) / v.length;
  const sd = v.length > 1 ? Math.sqrt(v.reduce((a, b) => a + (b - avg) ** 2, 0) / (v.length - 1)) : 0;
  return { n: v.length, avg: Math.round(avg * 10) / 10, sd: Math.round(sd * 10) / 10 };
}
// 입력 중(일부 역량만 입력) 100점 환산 — 입력한 역량만으로 계산
function partial100(items, scores) {
  const its = items.filter(i => scores[i.seq] != null); if (!its.length) return null;
  const noW = items.some(i => i.weight_ref == null || i.weight_ref === '');
  const ws = noW ? its.length : its.reduce((a, i) => a + +i.weight_ref, 0); if (!ws) return null;
  return Math.round(its.reduce((a, i) => a + scores[i.seq] * (noW ? 1 : +i.weight_ref), 0) / ws * 10 * 10) / 10;
}
// 해당 차수에서 내가 준 점수 평균 (cur: 지금 입력 중인 대상자 점수로 대체)
function stageAvg(stage, curTid, curVal) {
  const v = ST.my.filter(r => r.stage === stage && r.target_id !== curTid).map(r => myScoreInfo(r)).filter(x => x && x.s100 != null).map(x => x.s100);
  if (curVal != null) v.push(curVal);
  if (!v.length) return null;
  return { n: v.length, avg: Math.round(v.reduce((a, b) => a + b, 0) / v.length * 10) / 10 };
}
function targetHtml(st, label) {
  if (!st) return `<span>${label} 평균 - / 목표 <b>${ADJ()}</b>점</span>`;
  const d = Math.round((st.avg - ADJ()) * 10) / 10, cls = Math.abs(d) <= 3 ? 'ok' : d > 0 ? 'hi' : 'lo';
  const pct = v => Math.max(0, Math.min(100, v));
  return `<span>${label} 평균 <b>${st.avg}</b>점 / 목표 <b>${ADJ()}</b>점</span><span class="d ${cls}">${d > 0 ? '+' : ''}${d}</span>
    <span class="gauge" title="막대: 내 평균, 세로선: 목표 ${ADJ()}점"><i style="width:${pct(st.avg)}%"></i><em style="left:${pct(ADJ())}%"></em></span><span class="tn" style="font-size:13px;color:var(--muted)">${st.n}명 기준</span>`;
}
function statsHint(st) {
  if (!st || st.n < 3) return '';
  const m = [];
  if (st.avg >= ADJ() + 10) m.push(`평균이 조정 기준(${ADJ()}점)보다 ${Math.round(st.avg - ADJ())}점 높습니다. 조정되면 전체적으로 낮아집니다.`);
  if (st.sd < 3) m.push(`대상자 간 점수 차이가 작습니다(편차 ${st.sd}점). 조정 후에도 차이가 거의 나지 않습니다.`);
  return m.length ? `<div class="note warn">${m.map(esc).join('<br>')}</div>` : '';
}
function finalBar(stage, rows) {
  const open = rows.filter(r => r.status !== 'submitted' && r.form_code && !(stage === 2 && !r.stage1_done));
  if (!open.length) return '';
  const filled = open.filter(r => myKey(r) === 'filled').length, wait = rows.filter(r => stage === 2 && !r.stage1_done && r.status !== 'submitted').length;
  return `<div class="final"><div class="t">${stage}차 평가 ${open.length}명 중 <b>${filled}명 입력 완료</b>${wait ? ` · 1차 대기 ${wait}명은 1차 제출 후 따로 최종 제출` : ''}<br>
    모두 입력한 뒤 최종 제출하세요. 최종 제출 전까지는 언제든 수정할 수 있습니다.</div>
    <button class="btn pri" data-act="submitAll" data-s="${stage}" ${ST.settings.is_open ? '' : 'disabled'}>${stage}차 최종 제출</button></div>`;
}
HANDLERS.submitAll = async a => {
  const stage = +a.dataset.s;
  const open = ST.my.filter(r => r.stage === stage && r.status !== 'submitted' && r.form_code && !(stage === 2 && !r.stage1_done));
  const miss = open.filter(r => myKey(r) !== 'filled');
  if (miss.length) {
    const m = modal(`<h3>아직 입력하지 않은 대상자가 있습니다</h3><p>모든 역량 점수를 입력해야 최종 제출할 수 있습니다.</p>
      <div class="tbl-wrap"><table><tbody>${miss.map(r => { const x = myScoreInfo(r); return `<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.team || '')}</td><td>${x ? `입력 ${x.filled}/${x.n}` : '미작성'}</td>
        <td><button class="btn sm pri" data-act="open" data-t="${r.target_id}" data-s="${stage}">입력하기</button></td></tr>`; }).join('')}</tbody></table></div>
      <div class="acts"><button class="btn" data-x="c">닫기</button></div>`);
    m.addEventListener('click', e => { if (e.target.dataset.x || e.target.dataset.act) closeModal(); });
    return;
  }
  const rows = open.map(r => ({ r, x: myScoreInfo(r) })).sort((p, q) => (q.x.s100 ?? 0) - (p.x.s100 ?? 0));
  const m = modal(`<h3>${stage}차 평가 최종 제출</h3>
    <p>아래 ${rows.length}명의 평가를 한 번에 제출합니다. <b>제출 후에는 수정할 수 없습니다.</b></p>
    ${(() => { const st = myStats(stage); return st ? `<p style="margin-top:-6px">내가 준 ${stage}차 점수 평균 <b>${st.avg}점</b> (조정 기준 ${ADJ()}점) · 점수 차이(편차) ${st.sd}점</p>${statsHint(st)}` : ''; })()}
    <div class="tbl-wrap"><table><thead><tr><th>성명</th><th>팀</th><th class="num">점수(100점 환산)</th><th class="num">원점수</th></tr></thead><tbody>
    ${rows.map(({ r, x }) => `<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.team || '')}</td><td class="num"><b>${x.s100 ?? '-'}</b></td><td class="num" style="color:var(--muted)">${x.sum} / ${x.max}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="acts"><button class="btn" data-x="n">취소</button><button class="btn pri" data-x="y">최종 제출</button></div>`, true);
  m.addEventListener('click', async e => {
    const x = e.target.dataset.x; if (!x) return;
    if (x === 'n') return closeModal();
    e.target.disabled = true;
    try { const n = await api.submitAll(stage); closeModal(); toast(`${n}명 최종 제출했습니다`); go('my'); }
    catch (er) { closeModal(); toast(errMsg(er), true); go('my'); }
  });
};
function myScoreInfo(r) {
  const e = ST.myEv && ST.myEv.get(r.target_id + '-' + r.stage), its = (ST.myItems || {})[r.form_code] || [];
  if (!e || !its.length) return null;
  const vals = its.map(i => e.scores[i.seq]).filter(v => v != null);
  return { e, n: its.length, filled: vals.length, sum: vals.reduce((a, b) => a + b, 0), max: its.length * 10, s100: score100(its, e.scores) };
}
function myScoreCell(r) {
  const x = myScoreInfo(r);
  if (!x) return '';
  if (x.filled < x.n) return `입력 ${x.filled}/${x.n}`;
  return `<b>${x.s100}</b><small> / 100</small>${x.max !== 100 ? `<div style="font-size:12px;color:var(--muted)">원점수 ${x.sum}/${x.max}</div>` : ''}`;
}
HANDLERS.myCompare = a => {
  const stage = +a.dataset.s;
  const rows = ST.my.filter(r => r.stage === stage).map(r => ({ r, x: myScoreInfo(r) })).filter(o => o.x)
    .sort((p, q) => (q.x.s100 ?? -1) - (p.x.s100 ?? -1) || p.r.name.localeCompare(q.r.name));
  const m = modal(`<h3>${stage}차 평가 · 내가 준 점수</h3>
    <p>${stage === 2 ? '본인이 입력한 2차 점수와 제출된 1차 점수(참고)를 표시합니다.' : '본인이 입력한 점수만 표시됩니다.'} 점수는 100점 환산 기준입니다. 100점 환산은 평가표 배점 비율을 반영한 점수로, 평가표가 달라도 비교할 수 있습니다.</p>
    <div class="tbl-wrap"><table><thead><tr><th>성명</th><th>팀</th><th>평가표</th><th class="num">점수(100점 환산)</th><th class="num">원점수</th><th class="num">역량 평균</th>${stage === 2 ? '<th class="num">1차 100점 환산</th>' : ''}<th>상태</th></tr></thead><tbody>
    ${rows.map(({ r, x }) => { const p1 = stage === 2 && ST.myP1.get(r.target_id); return `<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.team || '')}</td><td>${esc(r.form_name || '')}</td>
      <td class="num"><b>${x.s100 ?? '-'}</b></td><td class="num" style="color:var(--muted)">${x.filled < x.n ? `입력 ${x.filled}/${x.n}` : `${x.sum} / ${x.max}`}</td>
      <td class="num">${x.filled ? (x.sum / x.filled).toFixed(1) : '-'}</td>${stage === 2 ? `<td class="num">${p1 ? (score100(ST.myItems[r.form_code], p1.scores) ?? '-') : '-'}</td>` : ''}<td>${badge(x.e.status)}</td></tr>`; }).join('')}
    </tbody></table></div>
    <div class="acts"><button class="btn" data-x="c">닫기</button></div>`, true);

// 입력 내용을 임시저장. 성공하면 true
async function doAutosave() {
  const E = ST.ev; if (!E) return true;
  clearTimeout(E.timer);
  if (E.saving) await E.saving;
  if (!E.dirty) return true;
  const snap = JSON.stringify(E.scores);
  let ok = false;
  setAutoMsg('저장 중…');
  E.saving = (async () => {
    try {
      await api.saveEvaluation(E.t.target_id, E.stage, cleanScores(E.items, E.scores, false), false);
      if (JSON.stringify(E.scores) === snap) E.dirty = false;
      E.status = 'draft'; E.updated_at = nowISO(); ok = true;
      setAutoMsg('자동 저장됨 ' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }), 'ok');
    } catch (e) { setAutoMsg('자동 저장 실패: ' + errMsg(e) + ' — [임시저장]을 눌러 다시 시도하세요', 'err'); }
  })();
  await E.saving; E.saving = null;
  if (ok && E.dirty) return doAutosave();
  return ok && !E.dirty;
}

function admIdx() {
  const D = ST.adm;
  const acc = new Map(D.accounts.map(a => [a.emp_no, a]));
  const forms = new Map(D.forms.map(f => [f.code, f]));
  const ev = new Map(D.evaluations.map(e => [e.target_id + '-' + e.stage, e]));
  const items = {}; D.items.forEach(i => (items[i.form_code] = items[i.form_code] || []).push(i));
  Object.values(items).forEach(l => l.sort((a, b) => a.seq - b.seq));
  return { acc, forms, ev, items };
}
const accName = (I, emp) => emp ? ((I.acc.get(emp) || {}).name || emp) : '';
function stageKey(I, t, stage) {
  if (!t.form_code) return 'noform';
  const fk = e => e.status === 'draft' && (I.items[t.form_code] || []).length && Object.keys(e.scores || {}).length === I.items[t.form_code].length ? 'filled' : e.status;
  if (stage === 1) { if (!t.e1_emp) return 'noev'; const e = I.ev.get(t.id + '-1'); return e ? fk(e) : 'none'; }
  if (!t.e2_emp) return 'end';
  const e2 = I.ev.get(t.id + '-2'); if (e2) return fk(e2);
  const e1 = I.ev.get(t.id + '-1'); return e1 && e1.status === 'submitted' ? 'none' : 'wait';
}
const sortT = l => l.slice().sort((a, b) => (a.dept || '').localeCompare(b.dept || '') || (a.team || '').localeCompare(b.team || '') || (a.emp_no || '').localeCompare(b.emp_no || ''));

}

function sheetRows(wb, name, keyCol) {
  const ws = wb.Sheets[name]; if (!ws) return null;
  const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false });
  const hi = aoa.findIndex(r => r.some(c => String(c).trim() === keyCol));
  if (hi < 0) return null;
  const head = aoa[hi].map(c => String(c).trim());
  return aoa.slice(hi + 1).filter(r => r.some(c => String(c).trim() !== '')).map(r => {
    const o = {}; head.forEach((h, i) => { if (h) o[h] = String(r[i] ?? '').trim(); }); return o;
  });
}
const col = (o, ...names) => { for (const n of names) { const k = Object.keys(o).find(k => k === n || k.startsWith(n)); if (k && o[k] !== '') return o[k]; } return ''; };

function parseBase(wb) {
  const warn = [], out = { forms: [], items: [], accounts: [], targets: [], history: [] };
  const fr = sheetRows(wb, '평가표유형', '평가표코드');
  if (fr) fr.forEach(r => { const code = col(r, '평가표코드'); if (code) out.forms.push({ code, name: col(r, '평가표명') || code, kind: col(r, '구분') || null }); });
  const ir = sheetRows(wb, '문항', '평가표코드');
  if (ir) ir.forEach(r => {
    const form_code = col(r, '평가표코드'), seq = parseInt(col(r, '순서'), 10), name = col(r, '역량명');
    if (!form_code || !seq || !name) return;
    const w = parseFloat(col(r, '배점'));
    out.items.push({ form_code, seq, grp: col(r, '역량구분') || null, name, weight_ref: isNaN(w) ? null : w, ind1: col(r, '행동지표 1', '행동지표1') || null, ind2: col(r, '행동지표 2', '행동지표2') || null });
  });
  const formCodes = new Set(out.forms.map(f => f.code).concat(ST.adm.forms.map(f => f.code)));
  const itemForms = new Set(out.items.map(i => i.form_code));
  out.items = out.items.filter(i => { if (!out.forms.some(f => f.code === i.form_code) && !ST.adm.forms.some(f => f.code === i.form_code)) { warn.push(`문항: 평가표 ${i.form_code} 없음 → 제외`); return false; } return true; });
  out.forms.forEach(f => { if (!itemForms.has(f.code)) warn.push(`평가표 ${f.code}: 문항이 없습니다`); });
  const ar = sheetRows(wb, '평가자계정', '사번');
  if (ar) ar.forEach(r => {
    const emp_no = padEmp(col(r, '사번')), name = col(r, '성명'); if (!emp_no || !name) return;
    const email = col(r, '회사메일', '이메일') || null;
    if (!email && !ST.adm.accounts.some(x => x.emp_no === emp_no && x.email)) warn.push(`계정 ${name}(${emp_no}): 회사메일 미입력 → 로그인 불가`);
    out.accounts.push({ emp_no, name, email, role: col(r, '권한') === '관리자' ? 'admin' : 'evaluator' });
  });
  const emails = {}; out.accounts.forEach(a => { if (a.email) { const k = a.email.toLowerCase(); if (emails[k]) warn.push(`회사메일 중복: ${a.email}`); emails[k] = 1; } });
  const accSet = new Set(out.accounts.map(a => a.emp_no).concat(ST.adm.accounts.map(a => a.emp_no)));
  const tr = sheetRows(wb, '대상자명단', '사번');
  if (tr) tr.forEach(r => {
    const emp_no = padEmp(col(r, '사번')), name = col(r, '성명'); if (!emp_no || !name) return;
    let form_code = col(r, '평가표코드') || null, e1 = padEmp(col(r, '1차 평가자 사번')) || null, e2 = padEmp(col(r, '2차 평가자 사번')) || null;
    const included = col(r, '대상 여부', '대상여부') !== '제외';
    if (form_code && !formCodes.has(form_code)) { warn.push(`대상자 ${name}: 평가표 ${form_code} 없음 → 미지정 처리`); form_code = null; }
    if (e1 && !accSet.has(e1)) { warn.push(`대상자 ${name}: 1차 평가자 사번 ${e1} 계정 없음 → 미지정 처리`); e1 = null; }
    if (e2 && !accSet.has(e2)) { warn.push(`대상자 ${name}: 2차 평가자 사번 ${e2} 계정 없음 → 미지정 처리`); e2 = null; }
    if (included && !form_code) warn.push(`대상자 ${name}: 평가표 미지정 (화면에서 지정 필요)`);
    if (included && !e1) warn.push(`대상자 ${name}: 1차 평가자 미지정`);
    out.targets.push({ emp_no, name, dept: col(r, '부서') || null, team: col(r, '팀') || null, grade: col(r, '직급') || null, pos: col(r, '직책') || null, form_code, e1_emp: e1, e2_emp: e2, included, note: col(r, '비고') || null });
  });
  const hr = sheetRows(wb, '평가이력', '사번');
  if (hr) hr.forEach(r => {
    const emp_no = padEmp(col(r, '사번')), year = parseInt(col(r, '연도'), 10), grade = col(r, '등급').toUpperCase();
    if (!emp_no || !year || !grade || grade === '-') return;
    if (!GRADES.includes(grade)) { warn.push(`평가이력 ${col(r, '성명') || emp_no} ${year}년: 등급 "${grade}"는 S·A·B·C·D가 아님 → 제외`); return; }
    out.history.push({ emp_no, year, grade });
  });
  const tmp = hr ? hr.filter(r => /임시/.test(col(r, '비고'))).length : 0;
  if (tmp) warn.push(`평가이력: 임시값(예시) ${tmp}건이 포함되어 있습니다. 실제 등급 확정 후 다시 올려 주세요`);
  return { out, warn };
}
async function onUploadFile(e) {
  const file = e.target.files[0]; if (!file) return;
  let P;
  try { const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' }); P = parseBase(wb); }
  catch (x) { return toast('엑셀을 읽지 못했습니다: ' + errMsg(x), true); }
  const o = P.out;
  ST.upload = P;
  $('#uplPrev').innerHTML = `<ul class="upl-sum">
      <li><label class="chk"><input type="checkbox" id="u_f" ${o.forms.length ? 'checked' : 'disabled'}> 평가표 ${o.forms.length}종 · 문항 ${o.items.length}개</label></li>
      <li><label class="chk"><input type="checkbox" id="u_a" ${o.accounts.length ? 'checked' : 'disabled'}> 평가자 계정 ${o.accounts.length}명</label></li>
      <li><label class="chk"><input type="checkbox" id="u_h" ${o.history.length ? 'checked' : 'disabled'}> 평가이력 ${o.history.length}건 (${[...new Set(o.history.map(h => h.year))].sort().join('·') || '-'}년)</label></li>
      <li><label class="chk"><input type="checkbox" id="u_t" ${o.targets.length ? 'checked' : 'disabled'}> 대상자 ${o.targets.length}명 (평가 대상 ${o.targets.filter(t => t.included).length}명) → ${esc(ST.adm.settings.cycle)}년 평가에 반영</label>
        <label class="chk" style="margin-left:26px;color:var(--ink2)"><input type="checkbox" id="u_ow"> 이미 등록된 대상자의 평가표·평가자도 엑셀 기준으로 덮어쓰기 (체크하지 않으면 화면에서 지정한 값 유지)</label></li></ul>
    ${P.warn.length ? `<div style="font-size:15px;font-weight:500;color:var(--amber)">확인 사항 ${P.warn.length}건</div><ul class="warn-list">${P.warn.map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
    <button class="btn pri" data-act="applyUpload">반영하기</button>`;
}
HANDLERS.applyUpload = async a => {
  const o = ST.upload.out, doF = $('#u_f').checked, doA = $('#u_a').checked, doT = $('#u_t').checked, doH = $('#u_h').checked;
  if (!doF && !doA && !doT && !doH) return toast('반영할 항목을 선택하세요', true);
  if (!(await confirmBox('기초데이터 반영', '선택한 항목을 반영합니다. 같은 코드·사번은 덮어씁니다.', '반영'))) return;
  a.disabled = true; const msg = [];
  try {
    if (doF) { await api.adm.upsertForms(o.forms, o.items); msg.push(`평가표 ${o.forms.length}종`); }
    if (doA) {
      // 업로드로 본인의 관리자 권한이 해제되지 않도록 보호
      const accs = o.accounts.map(x => x.emp_no === ST.me.emp_no ? { ...x, role: 'admin' } : x);
      await api.adm.upsertAccounts(accs); msg.push(`계정 ${accs.length}명`);
    }
    if (doT) {
      const r = await api.adm.upsertTargets(ST.adm.settings.cycle, o.targets, $('#u_ow').checked);
      msg.push(`대상자 추가 ${r.inserted}명·갱신 ${r.updated}명`);
      if (r.skipped.length) msg.push(`건너뜀 ${r.skipped.length}명(평가 진행 중: ${r.skipped.join(', ')})`);
    }
    if (doH) { await api.adm.upsertHistory(o.history); msg.push(`평가이력 ${o.history.length}건`); }
    await confirmBox('반영 완료', msg.join('\n'), '확인');
    go('settings');
  } catch (e) { a.disabled = false; toast('반영 중 오류: ' + errMsg(e), true); }
};

/* ---------- 결과 엑셀 ---------- */
HANDLERS.export = async () => {
  try { ST.adm = await api.adm.loadAll(); } catch (e) { return toast(errMsg(e), true); }
  const D = ST.adm, I = admIdx();
  const T = sortT(D.targets.filter(t => t.included));
  const sum = (t, e) => e ? (I.items[t.form_code] || []).reduce((s, i) => s + (e.scores[i.seq] ?? 0), 0) : '';
  const stx = (t, st) => STATUS[stageKey(I, t, st)][0];
  const wb = XLSX.utils.book_new();
  const HM = histMap(D.history), HY = histYears();
  const head = ['사번', '성명', '부서', '팀', '직급', '직책'].concat(HY.map(y => y + '년 등급'), ['평가표코드', '평가표명', '1차 평가자', '1차 상태', '1차 합계', '1차 제출일시', '2차 평가자', '2차 상태', '2차 합계', '2차 제출일시']);
  const summary = [head].concat(T.map(t => {
    const e1 = I.ev.get(t.id + '-1'), e2 = I.ev.get(t.id + '-2'), f = I.forms.get(t.form_code) || {};
    return [t.emp_no, t.name, t.dept, t.team, t.grade, t.pos].concat(HY.map(y => HM.get(t.emp_no + '-' + y) || ''), [t.form_code, f.name, accName(I, t.e1_emp), stx(t, 1), sum(t, e1), e1 && e1.submitted_at ? fmtDT(e1.submitted_at) : '',
      accName(I, t.e2_emp) || '1차 종결', t.e2_emp ? stx(t, 2) : '', t.e2_emp ? sum(t, e2) : '', e2 && e2.submitted_at ? fmtDT(e2.submitted_at) : '']);
  }));
  const ws1 = XLSX.utils.aoa_to_sheet(summary); ws1['!cols'] = [8, 9, 12, 13, 6, 7, 9, 9, 9, 9, 26, 10, 9, 8, 13, 10, 9, 8, 13].map(w => ({ wch: w }));
  XLSX.utils.book_append_sheet(wb, ws1, '요약');
  const det = [['사번', '성명', '부서', '팀', '직급', '직책', '평가표코드', '차수', '평가자', '상태', '순서', '역량구분', '역량명', '배점(참고)', '점수']];
  T.forEach(t => [1, 2].forEach(st => {
    const e = I.ev.get(t.id + '-' + st); if (!e) return;
    (I.items[t.form_code] || []).forEach(i => det.push([t.emp_no, t.name, t.dept, t.team, t.grade, t.pos, t.form_code, st + '차', accName(I, e.evaluator_emp), STATUS[e.status][0], i.seq, i.grp, i.name, i.weight_ref ?? '', e.scores[i.seq] ?? '']));
  }));
  const ws2 = XLSX.utils.aoa_to_sheet(det); ws2['!cols'] = [8, 9, 12, 13, 6, 7, 9, 6, 10, 9, 6, 8, 22, 9, 6].map(w => ({ wch: w }));
  XLSX.utils.book_append_sheet(wb, ws2, '점수상세');
  D.forms.forEach(f => {
    const its = I.items[f.code] || [], ts = T.filter(t => t.form_code === f.code);
    if (!ts.length || !its.length) return;
    const r1 = ['', '', '', '', '', '', ''].concat(its.map(i => '1차'), ['1차'], its.map(i => '2차'), ['2차']);
    const r2 = ['사번', '성명', '부서', '팀', '직급', '1차 평가자', '2차 평가자'].concat(its.map(i => i.name), ['합계'], its.map(i => i.name), ['합계']);
    const r3 = ['배점(참고)', '', '', '', '', '', ''].concat(its.map(i => i.weight_ref ?? ''), [''], its.map(i => i.weight_ref ?? ''), ['']);
    const rows = ts.map(t => {
      const e1 = I.ev.get(t.id + '-1'), e2 = I.ev.get(t.id + '-2');
      const sc = e => its.map(i => e && e.status === 'submitted' ? (e.scores[i.seq] ?? '') : '');
      return [t.emp_no, t.name, t.dept, t.team, t.grade, accName(I, t.e1_emp), accName(I, t.e2_emp) || '1차 종결']
        .concat(sc(e1), [e1 && e1.status === 'submitted' ? sum(t, e1) : ''], sc(e2), [e2 && e2.status === 'submitted' ? sum(t, e2) : '']);
    });
    const ws = XLSX.utils.aoa_to_sheet([[`${f.code} ${f.name} — 제출 완료된 점수만 표시`], r1, r2, r3].concat(rows));
    ws['!cols'] = [8, 9, 12, 13, 6, 10, 10].map(w => ({ wch: w })).concat(Array(its.length * 2 + 2).fill({ wch: 11 }));
    const nm = (f.code + ' ' + f.name).replace(/[\\\/\?\*\[\]:]/g, '').slice(0, 31);
    XLSX.utils.book_append_sheet(wb, ws, nm);
  });
  const d = new Date(), stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}_${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}`;
  XLSX.writeFile(wb, `${D.settings.cycle}_역량평가_결과_${stamp}.xlsx`);
  toast('다운로드했습니다');
};
